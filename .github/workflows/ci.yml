name: "Verify: Rust checks, wheel, container smoke"

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: "Rust: fmt, clippy, tests (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      - name: cargo clippy --all-targets -- -D warnings
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  wheel:
    name: "Wheel: maturin build, template.Dockerfile ships in it (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      # The package data must ride in the wheel: a project renders its Dockerfile from it.
      - name: maturin build, assert template.Dockerfile is in the wheel, devkit-container --version
        shell: bash
        run: |
          uv sync
          uv run maturin build --release --out dist
          uv run python -c "import zipfile,glob; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'devkit_container/template.Dockerfile' in names, names"
          uv run maturin develop
          uv run --no-sync devkit-container --version

  # The only place the entrypoint runs for real: the shipped template built around a
  # scratch app with this checkout's wheel installed (tests/docker_smoke.rs).
  container-smoke:
    name: "Docker: build the image from the template, run the entrypoint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: cargo test --test docker_smoke -- --ignored (builds the image, starts the app through the entrypoint)
        run: |
          uv sync
          cargo test --test docker_smoke -- --ignored --nocapture
